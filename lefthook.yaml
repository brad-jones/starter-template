# spec: https://github.com/evilmartians/lefthook/blob/master/docs/configuration.md

pre-commit:
  scripts:
    "fix-script-execute-bit.ts":
      runner: pixi run deno run -qA
      stage_fixed: true
  commands:
    dprint:
      run: pixi run dprint fmt --allow-no-files {staged_files}
      stage_fixed: true
    lint:
      run: pixi run task lint

commit-msg:
  commands:
    lint:
      run: pixi run cog verify -f {1}
