[workspace]
platforms = ["linux-64"]
channels = ["https://prefix.dev/brads-forge", "conda-forge"]

[tasks]
init = "task init"

[tasks.code]
depends-on = ["init"]
cmd = "code ."

[target.unix.activation.env]
PATH = "$PWD/scripts:$PATH"

[dependencies]
deno = ">=2.9.6,<2.10"
lefthook = ">=2.1.11,<3"
xcaffold = ">=0.16.3,<0.17"
cocogitto = ">=7.0.0,<8"
task = ">=3.53.1,<4"
dprint = ">=0.56.1,<0.57"
dotnetup = ">=0.5.2,<0.6"
go-sops = ">=3.13.3,<4"
copilot-cli = ">=1.0.81,<2"
skopeo = ">=1.24.0,<2"
gh = ">=2.98.0,<3"
age = ">=1.3.1,<2"
